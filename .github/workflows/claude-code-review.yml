name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          exclude_comments_by_actor: 'github-actions[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - TypeScript quality and best practices (interfaces over types, enums, strict typing)
            - Test automation correctness: determinism, isolation, no timing-based flakiness
            - Web3/EVM correctness: tx handling, retries, nonce/gas, contract interactions
            - Potential bugs or race conditions
            - Security implications (keys, secrets, env handling)
            - Adherence to the patterns in CLAUDE.md and ARCHITECTURE.md

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: '--allowedTools "Bash(gh api*),Bash(gh pr*),Bash(git*),Read,Glob,Grep"'
